services:
  db:
    build: ./docker/pql
    restart: always
    # set shared memory limit when using docker compose
    shm_size: 1g
    volumes:
      - ./docker/pql/schema.sh:/docker-entrypoint-initdb.d/schema.sh:ro
      - pgdata:/var/lib/postgresql/
    env_file:
      - .env
    healthcheck:
      test: ["CMD-SHELL", "pg_isready", "-d", "postgres"]
      interval: 10s
      timeout: 10s
      retries: 5
      start_period: 60s
    ports:
      - 5432:5432

  adminer:
    image: adminer
    restart: always
    ports:
      - 8081:8080

  api:
    build:
      context: .
      dockerfile: ./docker/api.Dockerfile
      args:
        EMBEDDING_MODEL_NAME: ${EMBEDDING_MODEL_NAME}
    command: uvicorn src.api.main:app --host 0.0.0.0 --port 8000
    depends_on:
      - db
    env_file:
      - .env
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

  frontend_nginx:
    build:
      context: .
      dockerfile: ./docker/frontend.Dockerfile
    ports:
      - 8080:80
    depends_on:
      - api

  ingestor_etl:
    build:
      context: .
      dockerfile: ./docker/ingestor_etl.Dockerfile
      args:
        EMBEDDING_MODEL_NAME: ${EMBEDDING_MODEL_NAME}
    command: python -m src.etl.ingestor.runner cs:cs:RO 1000
    depends_on:
      - db
    env_file:
      - .env
    profiles: ["etl"]
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

volumes:
  pgdata: